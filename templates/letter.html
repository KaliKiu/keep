<!DOCTYPE html>
<html>
<head>
    <title>keep. 💌</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="card" style="justify-content: space-between;">
        
        <!-- Top Navigation / Back Link -->
        <div>
            <a href="/?tab=inbox" class="link-btn" style="text-align: left; margin-top: 0; margin-bottom: 25px; display: inline-block;">
                ← Back to Inbox
            </a>

            <!-- Letter Paper Container (Dark & Cozy) -->
            <div class="tab-content" style="background: #1f1c19; border: 1px solid var(--border-color); padding: 30px; border-radius: 24px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);">
                
                <!-- Title -->
                <h2 style="font-size: 24px; margin-bottom: 8px; color: var(--text-main);">{{ .Letter.Title }}</h2>
                
                <!-- Date Meta -->
                <p style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;">
                    Written on {{ .Letter.CreatedAt.Format "January 02, 2006" }}
                </p>

                <hr style="border: none; border-top: 1px solid var(--border-color); margin-bottom: 20px;">

                <!-- Letter Body Content -->
                <div style="font-size: 16px; line-height: 1.7; color: var(--text-main); white-space: pre-wrap; word-break: break-word;">
                    {{ .Letter.Content }}
                </div>
            </div>
        </div>

        <!-- Footer branding inside card -->
        <div style="text-align: center; padding-top: 20px; color: var(--text-muted); font-size: 12px;">
            keep. 🌻
        </div>
    </div>
</body>
</html>
